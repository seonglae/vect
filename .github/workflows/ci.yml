name: Release relay tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/test_release_relay.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/test_release_relay.py'

permissions:
  contents: read

jobs:
  release-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test release tag handling
        run: python3 -m unittest discover -s scripts -p 'test_release_relay.py' -v
