name: Release relay

# Triggered when a release is published in the private source repo
# seonglae/vect-src. Its release.yml builds platform binaries, uploads them to
# a draft release there, then fires a repository_dispatch here so this
# workflow mirrors the release into this public repo's releases page, where
# end users install from.
#
# Also generates latest.json (the tauri updater manifest) from the mirrored
# updater artifacts (*.app.tar.gz / *.AppImage / *-setup.exe + their minisign
# .sig files) so installed apps self-update via
# https://github.com/seonglae/vect/releases/latest/download/latest.json.
#
# Requires the SOURCE_REPO_TOKEN secret (PAT with repo scope on
# seonglae/vect-src) since the source repo is private.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Tag in seonglae/vect-src to mirror (e.g. v0.2.0)
        required: true
  repository_dispatch:
    types: [vect-release-published]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source tag
        id: tag
        env:
          SOURCE_TAG: ${{ github.event.inputs.source_tag || github.event.client_payload.tag }}
        shell: bash
        run: |
          # Validate before writing workflow outputs or using release credentials.
          if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf '::error::Expected a version tag such as v0.3.5 or v0.3.5-rc.1\n' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$SOURCE_TAG" >> "$GITHUB_OUTPUT"
      - name: Download source release artifacts
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" \
            --repo seonglae/vect-src \
            --dir artifacts \
            --pattern '*.dmg' --pattern '*.deb' --pattern '*.AppImage' --pattern '*.msi' --pattern '*.exe' --pattern '*.app.tar.gz' --pattern '*.sig' \
            || echo "Some assets missing — continuing with what was downloaded"
          ls -la artifacts
      - name: Pull release notes from source repo CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          gh api repos/seonglae/vect-src/contents/CHANGELOG.md --jq '.content' | base64 -d > /tmp/source-changelog.md
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inblock = 1; next }
            inblock && /^## \[/ { inblock = 0 }
            inblock { print }
          ' /tmp/source-changelog.md > /tmp/release-body.md
          if [ ! -s /tmp/release-body.md ]; then echo "See assets below." > /tmp/release-body.md; fi
      - name: Generate updater manifest (latest.json)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          platform_entry() {
            local file="$1"
            if [ -z "$file" ] || [ ! -f "$file" ] || [ ! -f "$file.sig" ]; then return 0; fi
            local name
            name="$(basename "$file")"
            jq -n --arg sig "$(cat "$file.sig")" --arg url "$BASE/$name" \
              '{signature: $sig, url: $url}'
          }
          MAC="$(platform_entry "$(ls artifacts/*.app.tar.gz 2>/dev/null | head -1)")"
          LINUX="$(platform_entry "$(ls artifacts/*.AppImage 2>/dev/null | head -1)")"
          WIN="$(platform_entry "$(ls artifacts/*-setup.exe 2>/dev/null | head -1)")"
          jq -n --arg version "$VERSION" --arg pub_date "$PUB_DATE" \
            --argjson mac "${MAC:-null}" --argjson linux "${LINUX:-null}" --argjson win "${WIN:-null}" \
            '{version: $version, pub_date: $pub_date, platforms: ({"darwin-aarch64": $mac, "linux-x86_64": $linux, "windows-x86_64": $win} | with_entries(select(.value != null)))}' \
            > artifacts/latest.json
          cat artifacts/latest.json
      - name: Create mirrored release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Vect ${{ steps.tag.outputs.tag }}
          body_path: /tmp/release-body.md
          files: artifacts/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
